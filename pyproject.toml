[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-guard"
version = "0.1.0"
description = "Event-driven financial operation reconciliation system"
requires-python = ">=3.13"

dependencies = [
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "confluent-kafka>=2.15,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx",
]
