[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-guard"
version = "0.1.0"
description = "Event-driven financial operation reconciliation system"
requires-python = ">=3.13"

dependencies = [
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "confluent-kafka>=2.15,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx",
    "ruff",
    "pyright[nodejs]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pyright]
include = [
    "src",
    "tests",
]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
