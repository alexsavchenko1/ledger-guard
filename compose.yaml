services:
  postgres:
    image: postgres:16
    container_name: ledger-guard-postgres
    environment:
      POSTGRES_DB: ledger_guard
      POSTGRES_USER: ledger_guard
      POSTGRES_PASSWORD: ledger_guard
    ports:
      - "5433:5432"
    volumes:
      - ledger_guard_postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_guard -d ledger_guard"]
      interval: 5s
      timeout: 3s
      retries: 10


  kafka-volume-init:
    image: apache/kafka:4.3.1
    container_name: ledger-guard-kafka-volume-init
    user: "0:0"
    volumes:
      - ledger_guard_kafka_data:/tmp/kraft-combined-logs
    entrypoint:
      - /bin/sh
      - -c
      - 'chown -R 1000:1000 /tmp/kraft-combined-logs'

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: ledger-guard-kafka
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - ledger_guard_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: ledger-guard-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: operation-events
      KAFKA_DLQ_TOPIC: operation-events-dlq
      KAFKA_GROUP_ID: ledger-guard-consumer
      LOG_LEVEL: INFO
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_kafka_topics.sh:/scripts/create_kafka_topics.sh:ro
    entrypoint:
      - /bin/sh
      - /scripts/create_kafka_topics.sh

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-guard-consumer
    environment:
      DATABASE_URL: postgresql://ledger_guard:ledger_guard@postgres:5432/ledger_guard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-guard-api
    command:
      - uvicorn
      - ledger_guard.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql://ledger_guard:ledger_guard@postgres:5432/ledger_guard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ledger_guard_postgres_data:
  ledger_guard_kafka_data:
