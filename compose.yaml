services:
  postgres:
    image: postgres:16
    container_name: ledger-guard-postgres
    environment:
      POSTGRES_DB: ledger_guard
      POSTGRES_USER: ledger_guard
      POSTGRES_PASSWORD: ledger_guard
    ports:
      - "5433:5432"
    volumes:
      - ledger_guard_postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_guard -d ledger_guard"]
      interval: 5s
      timeout: 3s
      retries: 10


  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: ledger-guard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-guard-consumer
    environment:
      DATABASE_URL: postgresql://ledger_guard:ledger_guard@postgres:5432/ledger_guard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

volumes:
  ledger_guard_postgres_data:
